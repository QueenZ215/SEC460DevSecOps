<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nightwatch -- Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #0d1117; color: #c9d1d9;
           display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px;
            padding: 2rem; width: 100%; max-width: 360px; }
    h1 { color: #58a6ff; font-size: 1.5rem; margin-bottom: 0.25rem; }
    .sub { color: #8b949e; font-size: 0.85rem; margin-bottom: 1.5rem; }
    label { display: block; color: #8b949e; font-size: 0.85rem; margin-bottom: 0.25rem; }
    input { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
            color: #c9d1d9; padding: 0.5rem 0.75rem; font-family: monospace;
            font-size: 0.9rem; margin-bottom: 1rem; }
    input:focus { outline: none; border-color: #58a6ff; }
    button { width: 100%; background: #238636; border: none; border-radius: 6px;
             color: #fff; padding: 0.6rem; font-family: monospace; font-size: 0.9rem;
             cursor: pointer; }
    button:hover { background: #2ea043; }
    .error { color: #ff7b72; font-size: 0.85rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌙 Nightwatch</h1>
    <p class="sub">Sign in to continue</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <p class="error">{{ message }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
